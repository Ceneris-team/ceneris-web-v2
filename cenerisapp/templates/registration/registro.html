{% extends 'base.html' %}
{% load static %}

{% block title %}Registrarte - Controlador{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Registro de Usuario</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }} <!-- Renderiza el formulario de registro de Django -->
            <button type="submit" class="auth-button">Registrarse</button>
        </form>
        <p class="auth-switch">¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>
</div>
{% endblock %}
