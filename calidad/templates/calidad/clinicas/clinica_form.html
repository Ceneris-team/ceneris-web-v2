<!-- calidad/templates/calidad/clinicas/clinica_form.html -->
{% extends "dashboard/base_rrhh.html" %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
    <div class="page-header">
        <h1>{{ form_title }}</h1>
        <a href="{% url 'gestion_clinicas' %}" class="btn-secondary">&larr; Volver</a>
    </div>

    <div class="form-container">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button--primary">Guardar Clínica</button>
        </form>
    </div>
{% endblock %}
