{% extends "dashboard/base_rrhh.html" %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
    <div class="page-header">
        <h1>{{ form_title }}</h1>
        <a href="{% url 'lista_cargos' %}" class="btn-secondary">&larr; Volver al Listado</a>
    </div>
    <div class="form-container">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button--primary">Guardar Cargo</button>
        </form>
    </div>
{% endblock %}
