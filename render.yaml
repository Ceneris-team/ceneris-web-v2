# render.yaml - Versión FINAL CORREGIDA para Docker

services:
  - type: web
    name: ceneris-web
    runtime: docker
    
    repo: https://github.com/Ceneris-team/ceneris-web-v2.git
    branch: main   # OJO: apuntar a la rama con el codigo listo para prod (main de v2). develop tiene lo ultimo; mergear a main antes de desplegar.
    
    dockerfilePath: ./Dockerfile

    # Define el tipo de instancia (plan). 'starter' es el plan de $7.
    # Esto reemplaza a 'instanceCount' para definir el nivel de recursos.
    plan: starter

    # Aumentar el tiempo de espera para que la app responda al Health Check
    healthCheckPath: /

    buildCommand: "./build.sh"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ceneris-db
          property: connectionString
      - key: SECRET_KEY
        # NO generar uno nuevo para el cutover: SimpleJWT firma con SECRET_KEY.
        # Si cambia, TODOS los tokens que ya tienen los celulares (emitidos por
        # v1) quedan invalidos y se fuerza re-login masivo. Reusar el SECRET_KEY
        # de la v1 en produccion (setearlo a mano en el dashboard, sync: false).
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9" # O tu versión específica
      - key: WEB_CONCURRENCY
        value: 2 # Recomendado para el plan 'starter' para no agotar la RAM


databases:
  - name: ceneris-db
    databaseName: ceneris_db_w52d
    user: ceneris_db_w52d_user