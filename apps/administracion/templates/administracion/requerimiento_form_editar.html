{% extends "recursoshumanos/base_rrhh.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>{{ titulo }}: {{ object.agente }}</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <!-- Renderizamos el formulario campo por campo para más control -->
                        <div class="mb-3">
                            <label for="{{ form.tipo_monitoreo.id_for_label }}" class="form-label">{{ form.tipo_monitoreo.label }}</label>
                            {{ form.tipo_monitoreo }}
                        </div>
                         <div class="mb-3">
                            <label for="{{ form.agente.id_for_label }}" class="form-label">{{ form.agente.label }}</label>
                            {{ form.agente }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.cantidad_total.id_for_label }}" class="form-label">{{ form.cantidad_total.label }}</label>
                            {{ form.cantidad_total }}
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="{{ form.fecha_inicio.id_for_label }}" class="form-label">{{ form.fecha_inicio.label }}</label>
                                <input type="date" class="form-control" name="fecha_inicio" value="{{ form.fecha_inicio.value|date:'Y-m-d' }}" required>
                            </div>
                             <div class="col-md-6 mb-3">
                                <label for="{{ form.fecha_fin.id_for_label }}" class="form-label">{{ form.fecha_fin.label }}</label>
                                <input type="date" class="form-control" name="fecha_fin" value="{{ form.fecha_fin.value|date:'Y-m-d' }}" required>
                            </div>
                        </div>

                        <hr>
                        <a href="{% url 'administracion:lista_requerimientos' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
    // Añadimos la clase 'form-control' a los inputs generados por Django
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('#id_tipo_monitoreo').classList.add('form-control');
        document.querySelector('#id_agente').classList.add('form-control');
        document.querySelector('#id_cantidad_total').classList.add('form-control');
    });
</script>
{% endblock %}
