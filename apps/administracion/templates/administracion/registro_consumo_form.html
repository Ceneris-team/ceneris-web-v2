{% extends "recursoshumanos/base_rrhh.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3>{{ titulo }}</h3>
                    <p class="text-muted mb-0">Para: {{ object.requerimiento.agente }}</p>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.mes.id_for_label }}" class="form-label">{{ form.mes.label }}</label>
                            {{ form.mes }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.anio.id_for_label }}" class="form-label">{{ form.anio.label }}</label>
                            {{ form.anio }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.cantidad_consumida.id_for_label }}" class="form-label">{{ form.cantidad_consumida.label }}</label>
                            {{ form.cantidad_consumida }}
                        </div>
                        <hr>
                        <a href="{% url 'administracion:registrar_avance' object.requerimiento.id %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
